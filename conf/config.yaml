# Base config. Every run starts from this file.
# An experiment file in conf/experiment/ overrides parts of it:
#   uv run python scripts/experiment.py +experiment=001-toy

defaults:
  - _self_
  - override hydra/job_logging: console

# Name of the chosen experiment file, e.g. "001-toy".
# A run without +experiment=... is a debugging run and gets "scratch".
experiment_id: ${experiment_id:}
# Start time plus four random characters, e.g. "20261012-195950-a3f1".
# The launcher can fix it in advance through the RUN_ID environment variable.
run_id: ${run_id:}

seed: 0

# Per-server paths come from .env, never from committed config.
paths:
  runs_dir: ${env:RUNS_DIR,runs}
  data_dir: ${env:DATA_DIR,data}
  run_dir: ${paths.runs_dir}/${experiment_id}/${run_id}

# Weights & Biases. The API key (WANDB_API_KEY) and project name come from .env.
wandb:
  # online | offline | disabled. For a quick run without W&B: wandb.mode=disabled
  mode: ${env:WANDB_MODE,online}
  project: ${env:WANDB_PROJECT,ml-template}
  # Your W&B user or team. null means your default.
  entity: ${env:WANDB_ENTITY,null}

# Journal entry in the Overleaf project, pushed when a run finishes.
# Scratch runs never export. To skip it for one run: journal.export=false
journal:
  export: true

# Settings of the toy experiment. Replace with your own.
train:
  steps: 200
  lr: 0.05
  log_every: 20

hydra:
  run:
    dir: ${paths.run_dir}
  job:
    # Stay in the repo root, so relative paths in code keep working.
    chdir: false
  # No .hydra/ folder in the run folder: expkit writes config.yaml instead,
  # with secrets redacted.
  output_subdir: null
